[project]
name = "orchestra-document-intelligence"
version = "0.1.0"
description = "Orchestra AI document intelligence: invoice text extraction (PDF text layer / OCR), field parsing and confidence scoring"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.20",
  "pydantic>=2.10",
  "pypdf>=5.1",
  "pypdfium2>=4.30",
  "pillow>=11.0",
  "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "fpdf2>=2.8",
]
# PaddleOCR is optional and heavy; install it only where OCR_ENGINE=paddle is used.
paddle = [
  "paddleocr>=2.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
